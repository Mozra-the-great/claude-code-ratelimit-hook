name: CI

# Two stable job ids, meant to be the required status checks: `shellcheck` and
# `test`. There is deliberately NO workflow-level `paths:` filter (convention C1):
# a required check whose workflow does not start is reported as pending forever,
# not as skipped.
#
# Public repo => GitHub-hosted `ubuntu-latest` (free). Never a self-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-latest.
      - name: Lint shell scripts
        run: shellcheck --shell=sh install.sh uninstall.sh hooks/*.sh tests/*.sh
      - name: Validate the settings snippet
        run: jq empty settings.snippet.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jq, bash and dash are preinstalled on ubuntu-latest. The tests run in a
      # throw-away HOME and a stubbed `sleep`: no network, nothing outside a temp
      # dir is touched, and no test waits for a real window reset.
      - name: Tests under sh (dash on the runner)
        run: sh tests/run-all.sh
      # The settings snippet starts the hooks with `bash`, so that is the shell
      # they really run under in production.
      - name: Tests with the hooks under bash
        env:
          TEST_SH: bash
        run: sh tests/run-all.sh
